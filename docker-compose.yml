services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: komtet-retailcrm-backend
    init: true
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/integration.db}
    volumes:
      - komtet_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: komtet-retailcrm-frontend
    init: true
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  komtet_data:
